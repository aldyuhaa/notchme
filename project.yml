name: NotchMe
options:
  bundleIdPrefix: com.notchme
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.35"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
  configs:
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  NotchMe:
    type: application
    platform: macOS
    sources:
      - path: NotchMe
        excludes:
          - "**/.DS_Store"
      - path: ExtensionHost
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
    scheme:
      buildImplicitDependencies: true
      testTargets:
        - NotchMeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchme.app
        INFOPLIST_FILE: NotchMe/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotchMe/NotchMe.entitlements
        PRODUCT_NAME: NotchMe
        MARKETING_VERSION: "1.0.10"
        CURRENT_PROJECT_VERSION: "11"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
    entitlements:
      path: NotchMe/NotchMe.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.automation.apple-events: true
    postCompileScripts:
      - name: "Copy Built-in Extensions"
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BundledExtensions"
          mkdir -p "$DEST"

          # Pre-bundle WhatsApp provider with esbuild so node_modules aren't needed at runtime
          WA_PROVIDER="${SRCROOT}/Extensions/whatsapp-web/provider"
          if [ -d "${WA_PROVIDER}/node_modules" ]; then
            echo "Bundling WhatsApp provider with esbuild..."
            npx --yes esbuild \
              "${WA_PROVIDER}/index.mjs" \
              --bundle \
              --platform=node \
              --format=cjs \
              --outfile="${WA_PROVIDER}/bundle.cjs" 2>&1 && echo "esbuild: done" || echo "esbuild: failed (will use index.mjs)"
          fi

          for ext in ai-usage pomodoro whatsapp-web agents-status linear-mentions lastfm-scrobbler; do
            SRC="${SRCROOT}/Extensions/${ext}"
            if [ -d "$SRC" ]; then
              rsync -a --delete \
                --exclude="node_modules/" \
                --exclude=".DS_Store" \
                --exclude="__pycache__/" \
                "${SRC}/" "${DEST}/${ext}/"
            fi
          done
  NotchMeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NotchMeTests
    dependencies:
      - target: NotchMe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notchme.app.tests
        PRODUCT_NAME: NotchMeTests
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: $(TEST_HOST)
